spring:
  datasource:
    url: jdbc:h2:mem:catalogo;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
  jpa:
    hibernate:
      # Flyway creates the schema in tests. H2 exposes MySQL LONGTEXT as VARCHAR,
      # so Hibernate type validation is left to the real MySQL profile.
      ddl-auto: none
  flyway:
    enabled: true
  thymeleaf:
    cache: false

logging:
  file:
    name: target/test-logs/app-catalogo-test.log

app:
  admin:
    username: admin
    password: admin
  sync:
    push-batch-size: 100
    pull-batch-size: 300
    bootstrap-batch-size: 300
  contract:
    version: "1.0"
    payload-version: 1
    schema-version: "1.0"
  server:
    name: Catálogo de pruebas
    mdns-enabled: false
    mdns-bind-address:
    service-type: _appcatalogo._tcp.local.
    public-port: 8081
  pairing:
    code-duration: PT10M
  imports:
    max-file-size-bytes: 20971520
    max-rows: 10000
    retention: P7D
  storage:
    root: ${java.io.tmpdir}/app-catalogo-test-storage
    max-file-size-bytes: 26214400
    intent-duration: PT1H
