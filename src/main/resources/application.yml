server:
  address: 0.0.0.0
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: backend-app-catalogo
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/app_catalogo?createDatabaseIfNotExist=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 250MB
      max-request-size: 270MB
  lifecycle:
    timeout-per-shutdown-phase: 20s
  thymeleaf:
    cache: false

app:
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:admin}
  contract:
    version: "1.0"
    payload-version: 1
    schema-version: "1.0"
  server:
    name: ${SERVER_NAME:Catálogo Comercial}
    mdns-enabled: ${MDNS_ENABLED:true}
    mdns-bind-address: ${MDNS_BIND_ADDRESS:}
    service-type: _appcatalogo._tcp.local.
    public-port: ${SERVER_PORT:8081}
  pairing:
    code-duration: PT10M
  sync:
    push-batch-size: 100
    pull-batch-size: 300
    bootstrap-batch-size: 300
  imports:
    max-file-size-bytes: 20971520
    max-rows: 10000
    retention: P7D
  storage:
    root: ${STORAGE_ROOT:D:/AppCatalogoStorage}
    max-file-size-bytes: 26214400
    intent-duration: PT1H

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

logging:
  file:
    name: ${LOG_FILE:logs/app-catalogo.log}
  logback:
    rollingpolicy:
      max-file-size: 20MB
      max-history: 30
      total-size-cap: 1GB
  pattern:
    level: "%5p [requestId=%X{requestId:-}]"
