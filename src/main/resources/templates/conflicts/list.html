<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Conflictos</title><link rel="stylesheet" th:href="@{/css/admin.css}"><link rel="stylesheet" th:href="@{/css/admin-v2.css}"></head><body><header class="topbar"><div><strong>App Catálogo</strong><span>Servidor local</span></div><nav><a th:href="@{/admin/products}">Productos</a><a th:href="@{/admin/devices}">Dispositivos</a><a class="active" th:href="@{/admin/conflicts}">Conflictos</a></nav></header><main class="container"><section class="page-heading"><div><p class="eyebrow">Sincronización</p><h1>Conflictos pendientes</h1><p>La resolución conserva ambos payloads y publica una nueva versión cuando corresponde.</p></div></section><div class="notice" th:if="${message}" th:text="${message}"></div><section class="card table-card"><table><thead><tr><th>Entidad</th><th>Versiones</th><th>Servidor</th><th>Tablet</th><th>Resolución</th></tr></thead><tbody><tr th:each="conflict : ${conflicts}"><td><strong th:text="|${conflict.entityType} · ${conflict.entityId}|"></strong><small th:text="${conflict.conflictId}"></small></td><td th:text="|Servidor ${conflict.serverVersion} / base ${conflict.clientBaseVersion}|"></td><td><pre th:text="${conflict.serverPayload}"></pre></td><td><pre th:text="${conflict.clientPayload}"></pre></td><td><form method="post" th:action="@{/admin/conflicts/{id}/resolve(id=${conflict.conflictId})}"><select name="resolution"><option th:each="resolution : ${resolutions}" th:value="${resolution}" th:text="${resolution}"></option></select><textarea name="mergePayload" placeholder="JSON solo para MERGE"></textarea><button class="button primary" type="submit">Resolver</button></form></td></tr><tr th:if="${#lists.isEmpty(conflicts)}"><td colspan="5" class="empty">No hay conflictos pendientes.</td></tr></tbody></table></section></main></body></html>
